<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="astraPlaceholderTitle">
  <title id="astraPlaceholderTitle">Astra screenshot placeholder</title>
  <defs>
    <linearGradient id="astraBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#astraBg)"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#262b32" stroke-width="1"/>

  <!-- abstract chat window chrome -->
  <g transform="translate(80,90)">
    <rect x="0" y="0" width="640" height="320" rx="10" fill="#171b21" stroke="#262b32"/>
    <!-- window dots -->
    <circle cx="24" cy="24" r="5" fill="#3a3f47"/>
    <circle cx="44" cy="24" r="5" fill="#3a3f47"/>
    <circle cx="64" cy="24" r="5" fill="#3a3f47"/>
    <line x1="0" y1="46" x2="640" y2="46" stroke="#262b32"/>

    <!-- sidebar -->
    <rect x="0" y="46" width="120" height="274" fill="#14171d"/>
    <circle cx="60" cy="80" r="18" fill="#2a2f38"/>
    <rect x="30" y="112" width="60" height="8" rx="4" fill="#262b32"/>
    <rect x="30" y="132" width="60" height="8" rx="4" fill="#262b32"/>
    <rect x="30" y="152" width="60" height="8" rx="4" fill="#262b32"/>

    <!-- message bubbles, abstract -->
    <circle cx="150" cy="90" r="14" fill="#6E9BC7" opacity="0.55"/>
    <rect x="174" y="80" width="220" height="10" rx="5" fill="#2a2f38"/>
    <rect x="174" y="96" width="160" height="10" rx="5" fill="#22262d"/>

    <circle cx="150" cy="150" r="14" fill="#C9A24B" opacity="0.55"/>
    <rect x="174" y="140" width="180" height="10" rx="5" fill="#2a2f38"/>
    <rect x="174" y="156" width="260" height="10" rx="5" fill="#22262d"/>
    <rect x="174" y="172" width="120" height="10" rx="5" fill="#22262d"/>

    <circle cx="150" cy="220" r="14" fill="#6E9BC7" opacity="0.55"/>
    <rect x="174" y="210" width="200" height="10" rx="5" fill="#2a2f38"/>

    <!-- input bar -->
    <rect x="120" y="284" width="520" height="36" fill="#14171d" stroke="#262b32"/>
    <rect x="140" y="298" width="140" height="8" rx="4" fill="#262b32"/>
  </g>

  <text x="400" y="452" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="15" fill="#9ca0a8" text-anchor="middle">Screenshot placeholder — add a real Astra screenshot here</text>
</svg>
